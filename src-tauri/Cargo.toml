[package]
name = "tomato-timer"
version = "1.1.0"
description = "番茄计时器 · 桌面番茄钟"
authors = ["knight"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tomato_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
rfd = "0.15"
